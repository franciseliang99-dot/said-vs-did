[project]
name = "saidvsdid"
version = "0.1.0"
description = "Compare what agents in a multi-agent transcript say they did with what they actually did."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
saidvsdid = "saidvsdid.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
